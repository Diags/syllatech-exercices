[project]
name = "jobportal-agno"
version = "1.0.0"
description = "Projet de depart du cours syllatech « Agno : le framework d'agents IA complet »"
requires-python = ">=3.11"
dependencies = ["agno>=3.0,<4"]

[project.optional-dependencies]
dev = ["pytest>=8"]
reel = ["anthropic>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobportal"]
