[project]
name = "jobportal-autogen"
version = "1.0.0"
description = "Projet de depart du cours syllatech « Microsoft AutoGen : multi-agents »"
requires-python = ">=3.11"
dependencies = ["autogen-agentchat>=0.7,<1", "autogen-core>=0.7,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobportal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
