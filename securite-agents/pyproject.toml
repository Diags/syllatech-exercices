[project]
name = "jobportal-securite"
version = "1.0.0"
description = "Projet de depart du cours syllatech « Securiser les Agents IA »"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobportal"]
