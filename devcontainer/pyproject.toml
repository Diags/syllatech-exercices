[project]
name = "jobportal-devcontainer"
version = "1.0.0"
description = "Projet de depart du cours syllatech « Dev Containers »"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobportal"]
