[project]
name = "jobportal-pydanticai"
version = "1.0.0"
description = "Projet de depart du cours syllatech « PydanticAI : les agents type-safe »"
requires-python = ">=3.11"
dependencies = ["pydantic-ai-slim>=2.4,<3", "pydantic-graph>=2.4,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
# Le client du fournisseur, pour qui veut brancher un vrai modele.
# Rien dans ce projet n'en depend : tout tourne sans.
reel = ["pydantic-ai-slim[anthropic]>=2.4,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobportal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
