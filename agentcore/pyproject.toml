[project]
name = "jobportal-agentcore"
version = "1.0.0"
description = "Projet de depart du cours syllatech « Amazon Bedrock AgentCore »"
requires-python = ">=3.11"
dependencies = ["bedrock-agentcore>=1.23,<2", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobportal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
