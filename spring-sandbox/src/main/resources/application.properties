spring.application.name=runner-jobportal
server.port=0

# ⚠️ LE LEURRE DU CHAPITRE 1. Cette « cle » n'ouvre rien : elle est ici
# pour que le code d'un candidat execute dans la JVM de l'application
# puisse la lire, et que le test l'affirme. Dans une vraie application,
# cette ligne serait un vrai secret — et c'est tout le probleme.
jobportal.cle-api=sk-secret-de-production-a-ne-jamais-divulguer

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

# Le delai dur du bac a sable, et la memoire de l'enfant.
#
# ⚠️ Le delai n'est pas negociable dans son PRINCIPE — sans lui, une seule
# soumission fige le runner. Sa VALEUR, elle, est une decision : cinq
# secondes pour un test technique, davantage pour une compilation, et plus
# encore sur un noeud lent ou froid, ou le seul demarrage d'une JVM enfant
# peut couter plusieurs secondes.
jobportal.sandbox.delai-en-secondes=5
jobportal.sandbox.memoire-en-mio=48
