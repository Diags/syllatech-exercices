[project]
name = "jobportal-rag"
version = "1.0.0"
description = "Projet de depart du cours syllatech « RAG avance »"
requires-python = ">=3.11"
dependencies = ["langchain-text-splitters>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobportal"]
