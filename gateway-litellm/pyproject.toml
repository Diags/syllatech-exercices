[project]
name = "jobportal-gateway"
version = "1.0.0"
description = "Projet de depart du cours syllatech « Passerelle IA : LiteLLM + Spring Cloud Gateway »"
requires-python = ">=3.11"
dependencies = ["litellm>=1.80", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobportal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
