[project]
name = "jobportal-llm-local"
version = "1.0.0"
description = "Projet de depart du cours syllatech « LLM open-weight en local »"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6,<1",
    "openai>=3.24,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
finetune = [
    "peft>=0.14",
    "sentencepiece>=0.2",
    "torch>=2.5",
    "transformers>=4.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobportal"]
