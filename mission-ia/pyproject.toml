[project]
name = "jobportal-mission-ia"
version = "1.0.0"
description = "Projet de depart du cours syllatech « Mission IA : une application de bout en bout »"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "ollama>=0.6,<1",
    "openai>=3.24,<4",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobportal"]
