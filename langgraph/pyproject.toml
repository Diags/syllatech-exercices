[project]
name = "jobportal-langgraph"
version = "1.0.0"
description = "Projet de depart du cours syllatech « LangGraph »"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.2,<2", "langchain-core>=1.6,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
reel = ["langchain-anthropic>=1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobportal"]
