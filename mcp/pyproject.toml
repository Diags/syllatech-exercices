[project]
name = "jobportal-mcp"
version = "1.0.0"
description = "Projet de depart du cours syllatech « MCP : le Model Context Protocol »"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3"]

[project.scripts]
jobportal-serveur = "jobportal.serveur:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobportal"]
