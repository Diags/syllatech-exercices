[project]
name = "jobportal-adk"
version = "1.0.0"
description = "Projet de depart du cours syllatech « Google ADK : l'Agent Development Kit »"
requires-python = ">=3.11"
dependencies = ["google-adk>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobportal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
