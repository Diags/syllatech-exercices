[project]
name = "jobportal-vecteurs"
version = "1.0.0"
description = "Projet de depart du cours syllatech « Bases de donnees vectorielles »"
requires-python = ">=3.11"
dependencies = ["qdrant-client>=1.19,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobportal"]
