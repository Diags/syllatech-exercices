spring.application.name=portail-fullstack
server.port=0

# La base : H2 en memoire, donc rien a installer.
# ⚠️ LE NOM DE LA BASE EST UNIQUE PAR DEMARRAGE, et ce n'est pas
# cosmetique : une base H2 en memoire est partagee par TOUTES les
# applications du meme processus qui portent le meme nom. Deux contextes
# Spring lances dans la meme JVM — ce que font les tests de chapitres —
# se retrouvent alors sur les MEMES tables, et un chapitre qui desactive
# un compte fait echouer le chapitre suivant. Sans une seule erreur.
spring.datasource.url=jdbc:h2:mem:portail-${random.uuid};DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.username=sa
spring.datasource.password=

# ⚠️ `validate`, ET SURTOUT PAS `update`. Le schema appartient a Flyway ;
# Hibernate se contente de verifier que les entites lui correspondent. Avec
# `update`, une entite qui derive fait silencieusement muter la base de
# production — et personne ne sait plus quel est le schema reel.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ⚠️ `open-in-view=false` n'est pas un detail de performance. Laisse a
# `true` (le defaut de Spring Boot), la session JPA reste ouverte pendant
# le rendu de la reponse : un `LazyInitializationException` ne se produit
# jamais en developpement, et les requetes N+1 partent depuis la couche
# web sans que rien ne le signale. Le chapitre 3 les compte.

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ⚠️ En developpement seulement : voir le SQL reellement emis est la seule
# facon de decouvrir un N+1 avant la production.
spring.jpa.show-sql=false

# ⚠️ LA CLE DE SIGNATURE N'EST PAS ICI. Elle vient de l'environnement, et
# la valeur de repli ci-dessous ne sert qu'au developpement local. Le
# chapitre 6 mesure ce qu'une cle ecrite dans l'image coute.
portail.jwt.cle=${PORTAIL_JWT_CLE:cle-de-developpement-a-ne-jamais-utiliser-en-production}
portail.jwt.duree-access-en-secondes=${PORTAIL_JWT_ACCESS:300}
portail.jwt.duree-refresh-en-secondes=${PORTAIL_JWT_REFRESH:604800}

# Idem pour le secret de signature des webhooks Stripe.
portail.stripe.secret-webhook=${PORTAIL_STRIPE_WEBHOOK:whsec_developpement}
