[project]
name = "jobportal-langfuse"
version = "1.0.0"
description = "Projet de depart du cours syllatech « Langfuse : l'observabilite de vos LLM »"
requires-python = ">=3.11"
dependencies = ["langfuse>=3.0,<4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobportal"]
