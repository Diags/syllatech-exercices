[project]
name = "jobportal-mcp-client"
version = "1.0.0"
description = "Projet de depart du cours syllatech « Claude Code : MCP en pratique »"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
jobportal-mcp = "jobportal.serveur:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobportal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
