[project]
name = "jobportal-claude-api"
version = "1.0.0"
description = "Projet de depart du cours syllatech « API Claude : construire vos propres agents »"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.11,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobportal"]
