[project]
name = "jobportal-agentgateway"
version = "1.0.0"
description = "Projet de depart du cours syllatech « AgentGateway »"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4.23",
    "cel-python>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobportal"]
